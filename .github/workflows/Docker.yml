name: Publish OpenSign On-Premise images

on:
  workflow_dispatch:
  push:
    branches:
      - publish-v3.1.1

permissions:
  contents: read

concurrency:
  group: publish-onprem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify migration, MFA and German emails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/OpenSignServer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSignServer/package-lock.json
      - run: npm ci
      - run: npm run test:totp
      - run: npm run test:mail
      - run: npm run test:mfa
      - run: npm run test:startup
      - name: Check out the released on-premise 3.0.0 baseline
        uses: actions/checkout@v7.0.1
        with:
          ref: 0a5ee07cb25b07d31a1fdf7fd8869cdbe4f0c651
          path: .upgrade-baseline
      - name: Install released baseline dependencies
        run: npm ci
        working-directory: .upgrade-baseline/apps/OpenSignServer
      - name: Verify real 3.0.0 to 3.1.1 upgrade
        run: npm run test:upgrade
        env:
          OPENSIGN_UPGRADE_FROM: ${{ github.workspace }}/.upgrade-baseline/apps/OpenSignServer
          OPENSIGN_UPGRADE_VERSION: '3.0.0'
      - name: Check out the released on-premise 3.1.0 baseline
        uses: actions/checkout@v7.0.1
        with:
          ref: 3bd31490f7ab21de1903b050296b4af5503a616a
          path: .upgrade-baseline
      - name: Install 3.1.0 baseline dependencies
        run: npm ci
        working-directory: .upgrade-baseline/apps/OpenSignServer
      - name: Verify real 3.1.0 to 3.1.1 upgrade
        run: npm run test:upgrade
        env:
          OPENSIGN_UPGRADE_FROM: ${{ github.workspace }}/.upgrade-baseline/apps/OpenSignServer
          OPENSIGN_UPGRADE_VERSION: '3.1.0'

  test-client:
    name: Verify dashboard tour dismissal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/OpenSign
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSign/package-lock.json
      - run: npm ci
      - name: Install Linux native bindings
        run: npm install --no-save @napi-rs/canvas-linux-x64-gnu@0.1.100 @rolldown/binding-linux-x64-gnu@1.2.14 lightningcss-linux-x64-gnu@1.33.0
      - run: npm run test:tour

  publish:
    name: Publish ${{ matrix.component }}
    needs: [test, test-client]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            image: scrrrratchy/totp-opensign-client
            dockerfile: apps/OpenSign/Dockerhubfile
          - component: server
            image: scrrrratchy/totp-opensign-server
            dockerfile: apps/OpenSignServer/Dockerhubfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:v3.1.1
          labels: |
            org.opencontainers.image.source=https://github.com/Scrrrratchy/OpenSignTOTP
            org.opencontainers.image.version=v3.1.1
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=onprem-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=onprem-${{ matrix.component }}
