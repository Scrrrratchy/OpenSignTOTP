name: Publish OpenSign TOTP images

on:
  workflow_dispatch:
  push:
    branches:
      - publish-v2.41.2

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            image: scrrrratchy/totp-opensign-client
            dockerfile: apps/OpenSign/Dockerhubfile
          - component: server
            image: scrrrratchy/totp-opensign-server
            dockerfile: apps/OpenSignServer/Dockerhubfile

    steps:
      - name: Check out OpenSign v2.41.2 with TOTP patch
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish v2.41.2
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:v2.41.2
          labels: |
            org.opencontainers.image.source=https://github.com/Scrrrratchy/OpenSignTOTP
            org.opencontainers.image.version=v2.41.2-totp
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
