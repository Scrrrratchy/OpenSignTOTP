name: Publish OpenSign On-Premise images

on:
  workflow_dispatch:
  push:
    branches:
      - publish-v3.0.0-onprem

permissions:
  contents: read

concurrency:
  group: publish-onprem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify migration, MFA and German emails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/OpenSignServer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/OpenSignServer/package-lock.json
      - run: npm ci
      - run: npm run test:totp
      - run: npm run test:mail
      - run: npm run test:mfa
      - run: npm run test:startup

  publish:
    name: Publish ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            image: scrrrratchy/totp-opensign-client
            dockerfile: apps/OpenSign/Dockerhubfile
          - component: server
            image: scrrrratchy/totp-opensign-server
            dockerfile: apps/OpenSignServer/Dockerhubfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:v3.0.0-onprem
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Scrrrratchy/OpenSignTOTP
            org.opencontainers.image.version=v3.0.0-onprem
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=onprem-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=onprem-${{ matrix.component }}
